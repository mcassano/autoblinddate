[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoblinddate"
version = "0.1.0"
description = "Two LLMs on a text-chat blind date, each convinced the other is a real person."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/mcassano/autoblinddate"

[project.scripts]
autoblinddate = "autoblinddate.cli:main"

[tool.setuptools.packages.find]
include = ["autoblinddate*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Persona prose and regex tables read better unwrapped.
"autoblinddate/archetypes.py" = ["E501"]
"autoblinddate/sanitize.py" = ["E501"]
